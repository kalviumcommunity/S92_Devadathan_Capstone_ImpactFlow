services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - impactflow-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/impactflow}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/auth/google/callback}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - impactflow-uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: /
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  impactflow-mongo:
  impactflow-uploads:
